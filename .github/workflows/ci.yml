name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Type Check, Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The script passes --max-warnings 0, so a warning fails the build.
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      # The suite covers pure functions only and opens no connection.
      - name: Test
        run: npm test

      # `next build` imports every route module to collect page data, and
      # src/db throws when DATABASE_URL is missing. Nothing here runs a query,
      # so a placeholder is enough. Should a page ever read the database at
      # build time, this fails loudly rather than reaching for a real one.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci

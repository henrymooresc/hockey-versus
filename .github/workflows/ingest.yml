name: Daily Ingestion

on:
  # Disabled until the pipeline has been proved end to end against the hosted
  # database. See "Test it before enabling the cron" in TASKS.md. Uncomment
  # only after a manual run has ingested a real game and check:ingestion has
  # passed.
  # schedule:
  #   - cron: "0 15 * * *"  # 11:00 ET in summer, 10:00 in winter — cron is UTC
  workflow_dispatch:
    # Manual trigger — run from the GitHub Actions UI
    inputs:
      seasons:
        description: "Season ids, comma separated (e.g. 20232024,20242025). Leave blank for the current season."
        required: false
        type: string

# One run at a time. Two concurrent ingests would fight over the same progress
# flags and duplicate NHL API traffic.
concurrency:
  group: daily-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    name: Ingest yesterday's games
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # The scripts prefer the direct endpoint. They do long bulk writes and gain
    # from prepared statements, which the pooler cannot hold. DATABASE_URL is
    # the fallback, so both are supplied.
    env:
      DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The scripts default to the current season, so a blank input passes no
      # flag at all. A season list is for maintenance: recomputing an older
      # season, or backfilling one.
      #
      # The input is read through the environment rather than interpolated into
      # the script body, so it cannot inject shell. The pattern check then
      # rejects anything that is not a list of 8-digit ids, which also catches
      # an ordinary typo before it reaches the database.
      - name: Resolve target seasons
        id: target
        env:
          SEASONS_INPUT: ${{ inputs.seasons }}
        run: |
          if [ -z "$SEASONS_INPUT" ]; then
            echo "No season given — the scripts will use the current season."
            echo "args=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' "$SEASONS_INPUT" | grep -Eq '^[0-9]{8}(,[0-9]{8})*$'; then
            echo "::error::Invalid seasons input '$SEASONS_INPUT'. Expected 8-digit ids, comma separated, such as 20232024,20242025."
            exit 1
          fi
          echo "Targeting seasons: $SEASONS_INPUT"
          echo "args=--seasons $SEASONS_INPUT" >> "$GITHUB_OUTPUT"

      # The order below is a dependency chain, not a preference.
      #
      # There is deliberately no "were there games yesterday?" gate. Every
      # script already resumes from the per-game progress flags and exits
      # immediately when there is nothing to do, so an unconditional run is
      # self-healing: a day that failed is picked up by the next one. A gate
      # only adds a way for the whole job to skip while reporting success.

      # Discovers new games and creates the season row when the id rolls over.
      # Without this nothing else has anything to work on. It also refreshes
      # scores, so a game that was provisional on an earlier run corrects
      # itself, and it leaves the progress flags alone.
      - name: Discover games and refresh scores
        env:
          SEASON_ARGS: ${{ steps.target.outputs.args }}
        run: npm run ingest:seasons -- $SEASON_ARGS

      # Must precede shifts. ingest-shifts filters every row through the known
      # player set, so a player making their debut has their shifts silently
      # dropped if the roster is stale.
      - name: Refresh rosters
        env:
          SEASON_ARGS: ${{ steps.target.outputs.args }}
        run: npm run ingest:players -- $SEASON_ARGS

      - name: Ingest shifts
        env:
          SEASON_ARGS: ${{ steps.target.outputs.args }}
        run: npm run ingest:shifts -- $SEASON_ARGS

      - name: Ingest events
        env:
          SEASON_ARGS: ${{ steps.target.outputs.args }}
        run: npm run ingest:events -- $SEASON_ARGS

      - name: Compute versus stats
        env:
          SEASON_ARGS: ${{ steps.target.outputs.args }}
        run: npm run compute:versus -- $SEASON_ARGS

      # The step that makes a silent failure loud. Without it the job can skip
      # every ingest and still go green, which is exactly what the previous
      # version did.
      - name: Verify no played game is missing data
        run: npm run check:ingestion
